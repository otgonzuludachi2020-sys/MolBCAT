# Regression experiment configuration

data:
  datasets:
    - name: ESOL
      hf: scikit-fingerprints/MoleculeNet_ESOL
      col: label
    - name: Lipophilicity
      hf: scikit-fingerprints/MoleculeNet_Lipophilicity
      col: label

split:
    n_folds: 5
    inner_val_ratio: 0.10
    split_type: scaffold
    inner_split_type: scaffold
    random_seed: 42

model:
  emb_dim: 256
  hidden_dim: 512
  gin_hidden_dim: 128
  node_feat_dim: 9
  max_len: 120
  nhead: 4

training:
  batch_size: 32
  early_stop: 8
  epochs: 30           # GRU / GIN / MolBCAT epochs (regression)
  chemberta_epochs: 30    # ChemBERTa
  molbcat_epochs: 30   # MolBCAT same as GRU for regression

# Data efficiency uses different early_stop and epochs
data_efficiency:
  early_stop: 8
  epochs: 30

# Hyperparameter search grids
grids:
  gru_random:
    - hidden: 256
      lr: 1.0e-3
    - hidden: 256
      lr: 1.0e-4
    - hidden: 512
      lr: 1.0e-3
    - hidden: 512
      lr: 1.0e-4

  gru_frozen:
    - lr: 1.0e-3
    - lr: 5.0e-4

  gru_finetune:
    - lr: 1.0e-4
    - lr: 5.0e-5

  gin:
    - lr: 1.0e-3
    - lr: 5.0e-4
  
  chemberta:
    - lr: 5.0e-6
    - lr: 1.0e-5
    - lr: 2.0e-5
    - lr: 3.0e-5
    - lr: 5.0e-5

  molbcat:
    - lr_encoder: 1.0e-5
      lr_head: 1.0e-3
    - lr_encoder: 1.0e-5
      lr_head: 5.0e-4
    - lr_encoder: 5.0e-6
      lr_head: 1.0e-3

# Models to run
models:
  - name: GRU_Random
    pretrained: false
    freeze_encoder: false
    grid: gru_random

  - name: GRU_Frozen
    pretrained: true
    freeze_encoder: true
    grid: gru_frozen

  - name: GRU_Finetune
    pretrained: true
    freeze_encoder: false
    grid: gru_finetune

  - name: GIN
    grid: gin

  - name: ChemBERTa
    pretrained: true
    grid: chemberta

  - name: MolBCAT
    pretrained: true
    grid: molbcat

weights:
  pretrained_encoder: weights/pretrained_encoder_epoch10.pt
  vocab: weights/vocab.json
  
output:
  save_dir: ./outputs/regression
